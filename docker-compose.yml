version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pentest_db
    environment:
      POSTGRES_DB: pentestdb
      POSTGRES_USER: pentest
      POSTGRES_PASSWORD: pentest123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentest -d pentestdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pentest_net

  # ── FastAPI Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pentest_backend
    environment:
      DATABASE_URL: postgresql://pentest:pentest123@db:5432/pentestdb
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://localhost:80"]'
    volumes:
      - ./backend:/app
      - reports_data:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Needs root/capabilities for nmap raw sockets in lab
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - pentest_net

  # ── React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pentest_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pentest_net

volumes:
  postgres_data:
  reports_data:

networks:
  pentest_net:
    driver: bridge
